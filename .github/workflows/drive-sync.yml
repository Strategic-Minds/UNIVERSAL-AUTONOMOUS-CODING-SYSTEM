name: Drive Sync
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync state to Drive
        env:
          GOOGLEDRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLEDRIVE_ACCESS_TOKEN }}
          UACS_DRIVE: 1sDhkd1r1wGn-V3tzRM-f0b4CsG-Kleys
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 -c "
import urllib.request, urllib.parse, json, os
T=os.environ.get('GOOGLEDRIVE_ACCESS_TOKEN','')
if not T: print('No token'); exit(0)
F=os.environ.get('UACS_DRIVE','')
S=os.environ.get('COMMIT_SHA','')
b='sb01'
c=json.dumps({'last_sync':'$(date -u +%Y-%m-%dT%H:%M:%SZ)','sha':S,'repo':'Strategic-Minds/UNIVERSAL-AUTONOMOUS-CODING-SYSTEM','status':'synced'})
m=json.dumps({'name':'github-sync.json','parents':[F]})
body=f'--{b}\r\nContent-Type: application/json\r\n\r\n{m}\r\n--{b}\r\nContent-Type: text/plain\r\n\r\n{c}\r\n--{b}--'.encode()
url='https://www.googleapis.com/upload/drive/v3/files?'+urllib.parse.urlencode({'uploadType':'multipart'})
req=urllib.request.Request(url,method='POST',data=body)
req.add_header('Authorization',f'Bearer {T}')
req.add_header('Content-Type',f'multipart/related; boundary={b}')
try:
  with urllib.request.urlopen(req,timeout=15) as r: print(f'Drive OK: {r.status}')
except Exception as e: print(f'Drive skip: {e}')
"
